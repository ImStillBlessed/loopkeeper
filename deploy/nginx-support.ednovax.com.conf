# support.ednovax.com: the Ednovax Support Desk.
# Caddy terminates TLS and forwards to nginx on 8080, like the other sites on this server.
# nginx serves the built dashboard and passes /api/ to the desk's API on 127.0.0.1:8795.
server {
    listen 8080;
    server_name support.ednovax.com;

    root /var/www/support-desk/web/dist;
    index index.html;

    # Vite's hashed assets never change under the same name.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The dashboard shell is always fetched fresh, so a deploy shows up straight away.
    location = /index.html {
        add_header Cache-Control "no-cache";
        expires -1;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live updates (/api/events, /api/db/queries) are Server-Sent Events: never buffer them.
        proxy_set_header Connection        '';
        proxy_buffering           off;
        proxy_cache               off;
        chunked_transfer_encoding off;
        proxy_read_timeout        3600s;
        proxy_send_timeout        3600s;

        # WhatsApp exports and repository imports can be large.
        client_max_body_size 25m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
